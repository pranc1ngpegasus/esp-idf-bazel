[package]
name = "esp-idf-bazel"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "esp-idf-bazel"
harness = false        # do not use the built-in cargo test harness -> resolve rust-analyzer errors

[profile.release]
opt-level = "s"

[profile.dev]
debug = true    # Symbols are nice, and they don't increase the size on Flash
opt-level = "z"
[patch.crates-io]
esp-idf-sys = { git = "https://github.com/esp-rs/esp-idf.git" }
esp-idf-hal = { git = "https://github.com/esp-rs/esp-idf.git" }
esp-idf-svc = { git = "https://github.com/esp-rs/esp-idf.git" }

[dependencies]
log = "0.4"
esp-idf-svc = { version = "0.53", features = [
  "critical-section",
  "embassy-time-driver",
  "embassy-sync",
] }
# `embassy-time-driver` pulls in this crate without a queue feature. The
# default queue calls `__embassy_time_queue_item_from_waker`, which only
# embassy-executor defines. `generic-queue-8` is the standalone queue.
embassy-time-queue-utils = { version = "0.3", features = ["generic-queue-8"] }

[build-dependencies]
embuild = "0.33.5"
