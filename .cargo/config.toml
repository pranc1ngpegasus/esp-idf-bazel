[build]
target = "riscv32imac-esp-espidf"

[target.'cfg(target_os = "espidf")']
linker = "ldproxy"
runner = "espflash flash --monitor"
# ESP-IDF 6.1 builds with picolibc, and its libc shim asserts on a mismatch.
rustflags = ["--cfg", "espidf_time64", "--cfg", "espidf_picolibc"]

[unstable]
build-std = ["std", "panic_abort"]

[env]
MCU = "esp32c6"
ESP_IDF_VERSION = "v6.1.1"
# Use the ESP-IDF exported into the environment instead of letting esp-idf-sys
# clone and pip-install a managed copy.
ESP_IDF_TOOLS_INSTALL_DIR = "fromenv"
# A plain `cargo build` must reach the same configure step as the Bazel action:
# nothing here needs a managed component, and the component manager is one more
# pip package to supply.
ESP_IDF_COMPONENT_MANAGER = "false"
